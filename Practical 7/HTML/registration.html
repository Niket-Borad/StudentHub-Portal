<html>
<head>
   
    <title>Student Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <script src="../java/script.js"></script>
     <div id="notification" class="notification">
    <span id="notificationMessage"></span>
</div>
<h1>Student Registration</h1>
<hr>

<form onsubmit="return register(event)" action="../php/register.php" method="POST">
    <h2>Student Information</h2>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter Your Name" autocomplete="name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter Your Email" autocomplete="email" required>
    <br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter Your Mobile No" autocomplete="tel" required>
    <br><br>

    <div class="gender">
        <span class="gender-title">Gender</span>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
    </div>
    <hr>
    <h2>Academic Information</h2>
    <label>Course:</label>
    <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="Computer Engineering">Computer Engineering</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
    </select>
    <br><br>

    <label>Year:</label>
    <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="First Year">First Year</option>
        <option value="Second Year">Second Year</option>
        <option value="Third Year">Third Year</option>
        <option value="Fourth Year">Fourth Year</option>
    </select>
    <br><br>

    <div class="terms-box">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I accept the terms and conditions.</label>
    </div>
    <br>

    <input type="submit" value="Register">
    <input type="reset" onclick="return clearForm()" value="Clear">
</form>
<br>
<button ><a href="dashboard.html">Back to Dashboard</a></button>
<footer >

        <p>@2026 StudentHub Portal</p>

    </footer>
</body>
</html>
