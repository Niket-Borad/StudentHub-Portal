<html>
<head>
    
    <title>StudentHub - Login</title>
     <link rel="stylesheet" href="../css/style.css">
      
</head>

<body >
    <script src="../java/script.js"></script>
     <div id="notification" class="notification">
    <span id="notificationMessage"></span>
</div>
    <h1 >Student Login</h1>
    <hr>
    <form action="../php/login.php" method="POST">
        <h1>Login Portal</h1>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="12-72 bytes" minlength="12" maxlength="72" autocomplete="current-password" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    <p>New user? <a href="account-registration.html">Create a login</a>.</p>
    <p>Student details registration is separate from login accounts.</p>
    <p>Your username and password must match an existing login; meeting the format rules alone is not enough.</p>
    <br>
    <button>
    <a href="index.html">Back to Home</a></button>
    <footer >

        <p>@2026 StudentHub Portal</p>

    </footer>
</body>
</html>
